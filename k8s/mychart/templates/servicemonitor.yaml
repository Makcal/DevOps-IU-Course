apiVersion: monitoring.coreos.com/v1

kind: ServiceMonitor
metadata:
  name: myapp-monitor
  namespace: monitoring
  labels:
    release: monitoring  # This is critical - matches Prometheus selector

spec:
  selector:
    matchLabels:
      {{- include "mychart.selectorLabels" . | nindent 6 }}  # Matches your app's labels
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
  - targetPort: app-http
    path: /metrics
    interval: 30s
  namespaceSelector:
    matchNames:
    - default
