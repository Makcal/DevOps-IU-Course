apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "mychart.fullname" . }}-health-check
spec:
  args:
    - name: service-name
      value: {{ include "mychart.fullname" . }}
  metrics:
    - name: health-check
      provider:
        web:
          url: http://{{ .Values.service.name }}.default.svc:{{ .Values.service.port }}/health
          jsonPath: "{$.status}"
      successCondition: result == "ok"
      interval: 5s
      count: 6
      failureLimit: 2
      initialDelay: 10s
    
    - name: visits-available
      provider:
        web:
          url: http://{{ .Values.service.name }}.default.svc:{{ .Values.service.port }}/visits
          jsonPath: "{$.visits}"
      successCondition: result >= 0
      interval: 5s
      count: 3
      failureLimit: 1
    
    - name: error-rate
      provider:
        web:
          url: http://{{ .Values.service.name }}.default.svc:{{ .Values.service.port }}/metrics/error-rate
          jsonPath: "{$.error_rate}"
      successCondition: result < 0.05
      interval: 10s
      count: 5
      failureLimit: 2
